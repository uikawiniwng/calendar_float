name: runtime-context-check

on:
  push:
    branches:
      - refactor/runtime-context-soft-restart
    paths-ignore:
      - .ci/runtime-context-pass.txt

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production build
        run: pnpm build

      - name: Lifecycle regression check
        run: pnpm exec ts-node --transpile-only checks/calendar-float/lifecycle.check.ts

      - name: Runtime context regression check
        run: pnpm exec ts-node --transpile-only checks/calendar-float/runtime-context.check.ts

      - name: Record successful validation
        run: |
          mkdir -p .ci
          printf '%s\n' "$GITHUB_SHA" > .ci/runtime-context-pass.txt

      - name: Commit validation marker
        uses: EndBug/add-and-commit@v9.1.3
        with:
          default_author: github_actions
          message: '[ci] runtime-context pass'
          add: '.ci/runtime-context-pass.txt'
