name: refactor-check

on:
  push:
    branches:
      - refactor/unify-festival-date-resolver

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Festival date range regression check
        run: pnpm exec ts-node --transpile-only checks/calendar-float/festival-date-range.check.ts
